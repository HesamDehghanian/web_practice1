services:
  proxy:
    build: .
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    depends_on:
      - httpbin
    networks:
      - backend
    restart: unless-stopped

  httpbin:
    image: ghcr.io/mccutchen/go-httpbin:latest
    expose:
      - "8080"
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:
    driver: bridge
    internal: true
